[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
	{ id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.0"
hooks = [
	{ id = "markdownlint-cli2" },
]

[[repos]]
repo = "https://github.com/jorisroovers/gitlint"
rev = "v0.19.1"
hooks = [
	{ id = "gitlint" },
]

